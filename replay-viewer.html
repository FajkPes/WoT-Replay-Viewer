function parseReplay(buffer){
 const view=new DataView(buffer), bytes=new Uint8Array(buffer);if(buffer.byteLength<16)throw Error('Soubor je příliš krátký.');
 const count=view.getUint32(4,true);if(count<1||count>10)throw Error('Neplatný počet datových bloků.');let p=8,blocks=[];
 for(let i=0;i<count;i++){if(p+4>bytes.length)throw Error('Chybí délka bloku '+i);const n=view.getUint32(p,true);p+=4;if(n>bytes.length-p)throw Error('Neúplný blok '+i);let raw=new TextDecoder('utf-8',{fatal:true}).decode(bytes.subarray(p,p+n));try{blocks.push(JSON.parse(raw))}catch{throw Error('Blok '+i+' není platný JSON.')}p+=n}
 if(!blocks[0]||typeof blocks[0]!=='object')throw Error('Chybí metadata replaye.');
 return {meta:blocks[0],result:Array.isArray(blocks[1])?blocks[1][0]:null,extra:Array.isArray(blocks[1])?blocks[1].slice(1):[],blocks:count,packetBytes:bytes.length-p};
}
function normalized(data){
 const {meta,result}=data, common=result?.common||{}, players=result?.players||{}, vehicles=result?.vehicles||{};
 const rows=Object.entries(meta.vehicles||{}).map(([id,v])=>{const r=vehicles[id], stats=Array.isArray(r)?r[0]||{}:r||{};const pid=String(stats.accountDBID??'');const player=players[pid]||{};return {id,name:player.name||v.name||'—',clan:player.clanAbbrev||v.clanAbbrev||'',team:stats.team??v.team,vehicle:labelVeh(v.vehicleType),vehicleCode:v.vehicleType,stats,meta:v,pid}});
 const mine=rows.find(x=>x.pid===String(meta.playerID))||rows.find(x=>x.name===meta.playerName);
 const personal=mine?(result?.personal||{})[String(mine.stats.typeCompDescr)]||{}:{};
 return {rows,mine,personal,avatar:result?.personal?.avatar||{},common,meta,raw:data};
}

}
function explorerPane(d){return `<p class="info">Původní JSON z výsledkového bloku. Obsahuje i méně běžná pole, pro která nemáme ověřený český popis. Pole serverSettings jsou konfigurační data klienta, nikoli výsledek bitvy.</p>${[['Metadata replaye',d.meta],['Osobní výsledek',d.personal],['Avatar',d.avatar],['Souhrn bitvy',d.common],['Výsledky všech vozidel',d.raw.result?.vehicles],['Hráči',d.raw.result?.players],['Doplňkové bloky výsledků',d.raw.extra]].map(([name,obj])=>`<details><summary>${esc(name)}</summary><pre>${esc(JSON.stringify(obj,null,2))}</pre></details>`).join('')}`}
function playerDetail(row){const z=row.stats,aw=awardsFor(z);const assist=(z.damageAssistedRadio||0)+(z.damageAssistedTrack||0)+(z.damageAssistedStun||0);const lines=[['Shots fired',z.shots],['Direct hits',z.directHits],['Penetrations',z.piercings],['Damage from over 300 m',z.sniperDamageDealt],['Enemy vehicles damaged',z.damaged],['Enemy vehicles spotted',z.spotted],['Damage blocked by armor',z.damageBlockedByArmor],['Hits received',z.directHitsReceived],['Damage received',z.damageReceived],['Potential damage received',z.potentialDamageReceived],['Assistance by spotting',z.damageAssistedRadio],['Assistance by tracking',z.damageAssistedTrack],['Assistance by stun',z.damageAssistedStun],['Base capture points',z.capturePoints],['Base defence points',z.droppedCapturePoints],['Distance traveled',z.mileage],['Survival time',z.lifeTime],['Credits',z.credits]];return `<div class="detail-top"><strong>${esc(row.name)}${row.clan?' ['+esc(row.clan)+']':''}</strong><button class="detail-close" type="button" aria-label="Close player details">×</button></div><div class="detail-profile"><div class="detail-tank" title="${esc(row.vehicleCode)}.png">TANK IMAGE</div><div><b>${esc(row.vehicle)}</b><span>Team ${fmt(row.team)} · Player ID ${esc(row.pid)}</span></div></div><div class="detail-summary"><div><b>${fmt(z.damageDealt)}</b><small>Damage</small></div><div><b>${fmt(z.kills)}</b><small>Destroyed</small></div><div><b>${fmt(z.xp)}</b><small>Experience</small></div></div><div class="detail-list">${lines.map(([a,b])=>reportRow(a,b)).join('')}</div><div class="detail-awards">Achievements: ${aw.length?aw.map(a=>`<span title="${esc(a.code)}.png">${esc(a.name)}</span>`).join(''):'–'}</div>`}

function render(data){const d=normalized(data),own=d.mine?.team??1;$('#app').innerHTML=`<nav class="tabs"><button class="tab active" data-tab="personal">Personal Score</button><button class="tab" data-tab="team">Team Score</button><button class="tab" data-tab="details">Detailed Report</button><button class="tab raw-tab" data-tab="raw">All data</button></nav><div class="pane active" id="personal">${firstPane(d)}</div><div class="pane" id="team"><div class="team-columns">${teamTable(d.rows.filter(x=>x.team===own),'Our Team',d.mine)}${teamTable(d.rows.filter(x=>x.team!==own),'Enemy Team',d.mine)}</div></div><div class="pane" id="details">${detailPane(d)}</div><div class="pane raw-pane" id="raw">${explorerPane(d)}</div>`;document.querySelector('.footer').innerHTML=footer(d);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});const app=$('#app');const closeDetails=()=>app.querySelectorAll('.player-detail').forEach(x=>x.hidden=true);app.onclick=e=>{if(e.target.closest('.detail-close')){closeDetails();return}const tr=e.target.closest('.team-row');if(!tr)return;const row=d.rows.find(x=>x.id===tr.dataset.vehicleId);if(!row)return;closeDetails();const panels=app.querySelectorAll('.team-panel');const panel=panels[row.team===own?1:0];const box=panel?.querySelector('.player-detail');if(box){box.innerHTML=playerDetail(row);box.hidden=false}};app.onkeydown=e=>{if(e.key==='Escape')closeDetails();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.team-row')){e.preventDefault();e.target.click()}}}
render(JSON.parse($('#sample-data').textContent));$('#filename').textContent='Ukázka: '+JSON.parse($('#sample-data').textContent).meta.playerName+' · Prokhorovka';
$('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;$('#error').style.display='none';try{const data=parseReplay(await f.arrayBuffer());if(!data.result)throw Error('Replay neobsahuje výsledkový blok. Výsledky nelze zobrazit.');render(data);$('#filename').textContent=f.name}catch(err){$('#error').textContent=err.message;$('#error').style.display='block'}});
</script></body></html>
